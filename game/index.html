<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Connected</title>
    <style>
      /* `background` must match GROUND_COLOR in `src/palette.ts`. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #221038;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #game-container {
        flex: 1;
        /* Without this the flex child refuses to shrink and pushes the footer off-screen. */
        min-height: 0;
        width: 100%;
      }

      #to-standard {
        flex: none;
        align-self: center;
        font-family: monospace;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        color: #6b5a80;
        text-decoration: none;
        padding: 9px 12px 11px;
        border-radius: 6px;
        transition: color 120ms ease, background-color 120ms ease;
      }

      #to-standard:hover,
      #to-standard:focus-visible {
        color: #c98cff;
        background: #2b1644;
        outline: none;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <a id="to-standard" href="/">this is cool and all, but take me to the standard version</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
