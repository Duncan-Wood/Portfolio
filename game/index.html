<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Connected — a game by Duncan Wood</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo192.png" />
    <meta name="theme-color" content="#221038" />
    <link rel="canonical" href="https://duncanwoodpro.netlify.app/game/" />
    <meta name="author" content="Duncan Wood" />
    <meta name="description" content="Connected, a browser game by Duncan Wood about the part a resume leaves out — the story behind the CV, told the other way round." />
    <meta name="robots" content="noindex, nofollow" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://duncanwoodpro.netlify.app/game/" />
    <meta property="og:site_name" content="Duncan Wood" />
    <meta property="og:title" content="Connected — a game by Duncan Wood" />
    <meta property="og:description" content="A browser game about the part a resume leaves out — the story behind the CV, told the other way round." />
    <meta property="og:image" content="https://duncanwoodpro.netlify.app/og-game.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Connected — the part a resume leaves out" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://duncanwoodpro.netlify.app/og-game.png" />
    <noscript>
      <style>
        #loading,
        #game-container {
          display: none !important;
        }

        body > noscript {
          display: flex;
          flex: 1;
        }
      </style>
    </noscript>
    <style>
      /* `background` must match GROUND_COLOR in `src/palette.ts`. */
      html,
      body {
        margin: 0;
        height: 100%;
        background: #221038;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: manipulation;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #game-container {
        flex: 1;
        /* Without this the flex child refuses to shrink and pushes the footer off-screen. */
        min-height: 0;
        width: 100%;
      }

      #to-standard {
        flex: none;
        align-self: center;
        font-family: monospace;
        font-size: 12px;
        line-height: 1;
        white-space: nowrap;
        color: #9481aa;
        text-decoration: none;
        padding: 9px 12px 11px;
        border-radius: 6px;
        transition: color 120ms ease, background-color 120ms ease;
      }

      @media (pointer: coarse) {
        #to-standard {
          order: -1;
          align-self: flex-start;
          margin-top: env(safe-area-inset-top);
          padding: 12px;
          font-size: 11px;
          white-space: normal;
          text-align: left;
        }
      }

      #turn-upright {
        display: none;
        flex: 1;
        align-items: center;
        justify-content: center;
        padding: 0 24px;
        font-family: monospace;
        font-size: 16px;
        text-align: center;
        color: #c98cff;
      }

      #loading {
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        font-family: monospace;
        font-size: 14px;
        color: #9481aa;
      }

      #loading:not([hidden]) {
        display: flex;
      }

      #no-webgl,
      #needs-javascript {
        flex: 1;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 0 24px;
        font-family: monospace;
        font-size: 16px;
        line-height: 1.5;
        text-align: center;
        color: #c98cff;
      }

      #no-webgl:not([hidden]) {
        display: flex;
      }

      #needs-javascript {
        display: flex;
      }

      @media (pointer: coarse) and (orientation: landscape) {
        #game-container {
          display: none;
        }

        #turn-upright {
          display: flex;
        }
      }

      #to-standard:hover,
      #to-standard:focus-visible {
        color: #c98cff;
        background: #2b1644;
      }

      #to-standard:focus-visible {
        outline: 2px solid #c98cff;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="loading">loading…</div>
    <noscript>
      <div id="needs-javascript">
        <div>This game needs JavaScript.</div>
        <div>Use the link to the standard version of the site.</div>
      </div>
    </noscript>
    <div id="no-webgl" hidden>
      <div>This game needs WebGL, and this browser is not offering it.</div>
      <div>Try another browser, or use the link to the standard version of the site.</div>
    </div>
    <div id="turn-upright">Turn your phone upright to play.</div>
    <a id="to-standard" href="/">this is cool and all, but take me to the standard version</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
