# The last two steps are the point. Both halves have their own suites, but
# nothing else exercises the seam between them: the root build script builds
# each and copies the game's output into build/game. Every test can pass with
# /game broken on the deployed site.
#
# Deployment stays Netlify's. A second thing that deploys would mean two
# answers to what is live.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # `.node-version` is this repo's only Node version: Netlify reads the
      # same file for production builds, and mise reads it for local work.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - run: npm ci

      - run: npm --prefix game ci

      - run: npm test

      - run: npm --prefix game run typecheck

      - run: npm --prefix game test

      - run: npm run build

      - name: Check both halves landed in the build
        run: |
          test -f build/index.html || { echo "portfolio build is missing its entry point"; exit 1; }
          test -f build/game/index.html || { echo "game did not compose into build/game"; exit 1; }
